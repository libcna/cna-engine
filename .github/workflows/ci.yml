name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  # Weekly canary against the upstream development heads (job upstream-canary).
  schedule:
    - cron: "17 3 * * 1"

# Dependency refs must equal cmake/CnaEngineBaseline.cmake (ADR-002). The
# configure step runs with CNA_ENGINE_ENFORCE_BASELINE=ON, so a mismatch fails
# the build instead of silently testing another revision.
env:
  CNA_REF: 900d0db3b52d76d3115ebda0a0e04a25fefad1a5
  CNA_EXTENDED_REF: 86870ad2bf6b3d9a947edc359a5819c83f56f6dc
  SHARP_RUNTIME_REF: f2aecfefeac171b331787e5cdc4849507363ef0e
  # Workspace convention: at most three parallel compile and test jobs.
  JOBS: 3

jobs:
  engine:
    name: Engine build and tests (software/headless/null)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out cna-engine
        uses: actions/checkout@v4
        with:
          path: cna-engine

      - name: Check out cna
        uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: ${{ env.CNA_REF }}
          path: cna

      - name: Check out cna-extended
        uses: actions/checkout@v4
        with:
          repository: libcna/cna-extended
          ref: ${{ env.CNA_EXTENDED_REF }}
          path: cna-extended
          submodules: true

      - name: Check out sharp-runtime
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: ${{ env.SHARP_RUNTIME_REF }}
          path: sharp-runtime
          # The engine's tests build the GoogleTest Sharp Runtime vendors as a submodule.
          submodules: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Configure
        working-directory: cna-engine
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCNA_ENGINE_ENFORCE_BASELINE=ON
          -DCNA_ENGINE_PILOT_PROBES=OFF
          -DCNA_ENABLE_SDL=OFF -DCNA_ENABLE_VIDEO=OFF

      - name: Build
        working-directory: cna-engine
        run: cmake --build build --parallel "$JOBS"

      # Separate, labelled steps so a failure names its category.
      - name: Boundary checks
        working-directory: cna-engine
        run: ctest --test-dir build -L boundary --output-on-failure --parallel "$JOBS"

      - name: Unit tests
        working-directory: cna-engine
        run: ctest --test-dir build -L unit --output-on-failure --parallel "$JOBS"

      - name: Examples
        working-directory: cna-engine
        run: ctest --test-dir build -L example --output-on-failure --parallel "$JOBS"

      # Serial: timing checks compare runs of the same process.
      - name: Performance scaling
        working-directory: cna-engine
        run: ctest --test-dir build -L performance --output-on-failure

      - name: No test may be skipped silently
        working-directory: cna-engine
        shell: bash
        run: |
          ctest --test-dir build --parallel "$JOBS" --output-on-failure 2>&1 | tee ctest.log
          # CTest's own markers (a disabled test reports "***Not Run (Disabled)");
          # test names that merely contain such words must not match.
          if grep -Eq "\*\*\*(Skipped|Not Run)" ctest.log; then
            echo "::error::a test was skipped or disabled"; exit 1
          fi

      - name: Installed-package consumer probes
        working-directory: cna-engine
        run: CCACHE_NOHASHDIR=1 CNA_ENGINE_JOBS="$JOBS" tools/run_consumer_probes.sh build build-consumer

  # EXT-003: the upstream compatibility lane. cna-extended's own tests and
  # examples, built standalone against the pinned CNA, reported as separate
  # steps. Since cna-extended 86870ad nothing fails or is skipped (UP-004,
  # UP-005 and UP-011 are fixed), so any failure or skip fails the lane.
  cna-extended:
    name: Upstream lane - cna-extended at the pinned CNA
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out cna
        uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: ${{ env.CNA_REF }}
          path: cna

      - name: Check out cna-extended
        uses: actions/checkout@v4
        with:
          repository: libcna/cna-extended
          ref: ${{ env.CNA_EXTENDED_REF }}
          path: cna-extended
          submodules: true

      - name: Check out sharp-runtime
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: ${{ env.SHARP_RUNTIME_REF }}
          path: sharp-runtime

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Configure
        run: >
          cmake -S cna-extended -B cna-extended-build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCNA_EXTENDED_BUILD_TESTS=ON -DCNA_EXTENDED_BUILD_EXAMPLES=ON
          -DCNA_EXTENDED_CNA_DIR="$GITHUB_WORKSPACE/cna"
          -DCNA_ENABLE_SDL=OFF -DCNA_ENABLE_VIDEO=OFF

      - name: Build tests
        run: cmake --build cna-extended-build --target CnaExtendedTests --parallel "$JOBS"

      - name: Build examples
        run: cmake --build cna-extended-build --parallel "$JOBS"

      - name: Tests (none may fail or be skipped)
        shell: bash
        run: |
          ctest --test-dir cna-extended-build --parallel "$JOBS" --output-on-failure 2>&1 | tee ctest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "\*\*\*(Skipped|Not Run)" ctest.log; then
            echo "::error::a cna-extended test was skipped or disabled"; exit 1
          fi

  # EXT-003 early warning: the engine against the upstream development heads
  # (not the pins), weekly or on demand. A failure here is an upstream API
  # change to look at before the next baseline move (ADR-002); it never
  # blocks a push or pull request.
  upstream-canary:
    name: Canary - engine against upstream heads
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out cna-engine
        uses: actions/checkout@v4
        with:
          path: cna-engine

      - name: Check out cna (next)
        uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: next
          path: cna

      - name: Check out cna-extended (develop)
        uses: actions/checkout@v4
        with:
          repository: libcna/cna-extended
          ref: develop
          path: cna-extended
          submodules: true

      - name: Check out sharp-runtime (next)
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: next
          path: sharp-runtime
          submodules: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Revisions under test
        run: for r in cna cna-extended sharp-runtime; do echo "$r $(git -C $r rev-parse HEAD)"; done

      - name: Configure (baseline not enforced)
        working-directory: cna-engine
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCNA_ENGINE_ENFORCE_BASELINE=OFF
          -DCNA_ENGINE_PILOT_PROBES=OFF
          -DCNA_ENABLE_SDL=OFF -DCNA_ENABLE_VIDEO=OFF

      - name: Build
        working-directory: cna-engine
        run: cmake --build build --parallel "$JOBS"

      - name: Tests
        working-directory: cna-engine
        run: ctest --test-dir build --output-on-failure --parallel "$JOBS"

      - name: Installed-package consumer probes
        working-directory: cna-engine
        run: CCACHE_NOHASHDIR=1 CNA_ENGINE_JOBS="$JOBS" tools/run_consumer_probes.sh build build-consumer
