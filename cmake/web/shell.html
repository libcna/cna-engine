<!-- The page cna_engine_add_game() gives a browser build (plan.md GAME-001); adapted from
     backrooms- and school-simulator's pages. CMake fills in the title and the hint. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@CNA_ENGINE_GAME_TITLE@</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #111418; color: #e8ecf0; }
    body { display: grid; place-items: center; font: 16px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; border: 0; background: #111418; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #111418; pointer-events: none; }
    #loading[hidden] { display: none; }
    #loading-content { width: min(28rem, calc(100vw - 3rem)); text-align: center; }
    #loading h1 { margin: 0 0 1.5rem; font-size: 1.6rem; font-weight: 500; }
    #status { min-height: 1.5rem; margin: 0 0 0.75rem; }
    progress { display: block; width: 100%; height: 0.75rem; accent-color: #6aa6e8; }
    #hint { position: fixed; left: 0; right: 0; bottom: 0.6rem; text-align: center; font-size: 0.8rem; opacity: 0.55; pointer-events: none; }
    #hint:empty { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div id="loading-content">
      <h1>@CNA_ENGINE_GAME_TITLE@</h1>
      <p id="status">Downloading&hellip;</p>
      <progress id="progress" max="1" value="0"></progress>
    </div>
  </div>
  <div id="hint">@CNA_ENGINE_GAME_HINT@</div>
  <script>
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const hint = document.getElementById('hint');

    canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      loading.hidden = false;
      status.textContent = 'Graphics context lost. Reload the page to continue.';
      progress.hidden = true;
    });

    // Mouse look wants the mouse's raw movement, as the desktop build gets it. A plain pointer lock reports the movement
    // after the operating system's pointer acceleration, which damps slow movements. SDL asks for the lock without
    // options, so ask for unadjusted movement here and fall back to the plain lock where the browser does not offer it
    // (Firefox ignores the option, older Chrome versions reject it).
    (function () {
      const request = Element.prototype.requestPointerLock;
      if (!request) return;
      Element.prototype.requestPointerLock = function (options) {
        const element = this;
        const merged = Object.assign({ unadjustedMovement: true }, options);
        let result;
        try {
          result = request.call(element, merged);
        } catch (error) {
          return request.call(element, options);
        }
        if (result && typeof result.catch === 'function') {
          return result.catch(function (error) {
            if (error && error.name === 'NotSupportedError') return request.call(element, options);
            throw error;
          });
        }
        return result;
      };
    })();

    function setStatus(message) {
      if (!message) { loading.hidden = true; return; }
      loading.hidden = false;
      const counts = message.match(/\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/);
      if (counts) {
        progress.max = Number(counts[2]);
        progress.value = Number(counts[1]);
        progress.hidden = false;
        status.textContent = message.slice(0, counts.index).trim();
      } else {
        status.textContent = message;
        if (message === 'All downloads complete.') { progress.max = 1; progress.value = 1; progress.hidden = false; }
      }
    }

    var Module = {
      canvas: canvas,
      // ?arg=--frames&arg=600 passes the desktop command line.
      arguments: new URLSearchParams(window.location.search).getAll('arg'),
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left ? 'Preparing (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      },
      print: function (text) { console.log(text); },
      printErr: function (text) { console.warn(text); }
    };
    window.addEventListener('error', function (event) {
      if (event.target !== window) return;
      loading.hidden = false;
      status.textContent = 'Unable to start. Check the browser console and reload.';
      progress.hidden = true;
    });
    // Once the game is drawing, the loading cover goes away by itself (setStatus('') from Emscripten); the hint fades.
    setTimeout(function () { hint.style.transition = 'opacity 2s'; hint.style.opacity = 0; }, 20000);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
